[project]
name = "graphflow-cli"
version = "0.1.0"
description = "GraphFlow CLI: thin Typer wrapper over graphflow_core."
requires-python = ">=3.11"
dependencies = [
    "graphflow-core",
    "typer>=0.12",
]

[project.scripts]
graphflow = "graphflow_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphflow_cli"]
