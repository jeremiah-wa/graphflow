[project]
name = "graphflow-worker"
version = "0.1.0"
description = "GraphFlow worker: thin process runner that delegates to graphflow_core."
requires-python = ">=3.11"
dependencies = [
    "graphflow-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphflow_worker"]
