[project]
name = "graphflow-api"
version = "0.0.1"
description = "GraphFlow HTTP API: thin FastAPI wrapper over graphflow_core."
requires-python = ">=3.11"
dependencies = [
    "graphflow-core",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphflow_api"]
