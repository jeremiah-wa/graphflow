[project]
name = "graphflow-core"
version = "0.0.1"
description = "GraphFlow core: manifests, sources, mapping, sinks, and pipeline runner."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "neo4j>=5.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphflow_core"]
