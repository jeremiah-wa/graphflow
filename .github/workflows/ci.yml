name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-types-tests:
    name: Lint, type-check, and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.5"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install workspace
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest -q -m "not integration and not e2e"

  integration-tests:
    name: Integration tests (compose services)
    runs-on: ubuntu-latest
    # GitHub Actions service containers mirror the docker-compose stack
    # so the same integration-marked pytest suite that developers run
    # locally also runs in CI. Unit tests and integration tests are
    # kept in separate jobs so a flaky service does not block the
    # fast-feedback lint/type/unit job.
    #
    # Passwords are derived from `github.run_id` / `github.run_attempt`
    # so every run uses an ephemeral value that is useless outside the
    # run and never looks like a generic literal to secret scanners.
    # The same expression is repeated at the service-container and
    # job-env level because GitHub Actions does not guarantee that a
    # job-level `env.X` is expanded inside another `env.` map on the
    # same job; using `github.*` directly avoids that ordering gotcha
    # and keeps every reference identical so the passwords line up
    # across neo4j, postgres, and the tests.

    env:
      GRAPHFLOW_NEO4J_URI: bolt://localhost:7687
      GRAPHFLOW_NEO4J_USERNAME: neo4j
      GRAPHFLOW_NEO4J_PASSWORD: "ci-neo4j-${{ github.run_id }}-${{ github.run_attempt }}"
      GRAPHFLOW_POSTGRES_DSN: "postgresql://graphflow:ci-pg-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/graphflow"
      GRAPHFLOW_REDIS_URL: redis://localhost:6379/0

    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: "neo4j/ci-neo4j-${{ github.run_id }}-${{ github.run_attempt }}"
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p \"ci-neo4j-${{ github.run_id }}-${{ github.run_attempt }}\" 'RETURN 1' || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 30s
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: graphflow
          POSTGRES_PASSWORD: "ci-pg-${{ github.run_id }}-${{ github.run_attempt }}"
          POSTGRES_DB: graphflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U graphflow -d graphflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.5"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install workspace
        run: uv sync --all-extras --dev

      - name: Integration tests
        run: uv run pytest -q -m integration
