name: Bug
description: Report something broken or behaving incorrectly
title: ""
labels: ["Bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for defects, regressions, or unexpected behaviour.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is broken or behaving unexpectedly?
      placeholder: Describe the issue.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can the issue be reproduced?
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Docker version, browser, or other relevant details.
      value: |
        - OS:
        - Python:
        - Docker:
        - Browser:
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Logs, screenshots, links, or suspected cause.
    validations:
      required: false
