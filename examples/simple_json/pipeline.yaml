version: "0.1"

pipeline:
  name: company_network_pipeline
  source_ref: companies_json
  ontology_ref: company_network

  extraction:
    mode: none

  mapping:
    nodes:
      - label: Company
        source: items[]
        key:
          from_field: company_number
        properties:
          company_number: company_number
          name: company_name
          status: company_status

    relationships: []

  destination:
    type: neo4j
    connection_ref: neo4j_local
    write_mode: merge
    batch_size: 1000
